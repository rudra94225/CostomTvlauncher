name: Build and Release TV Launcher APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0) - leave blank for latest'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Prepare Direct APK for Release
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="TvOS Native Launcher $TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="TvOS Native Launcher $TAG"
          else
            TAG="latest"
            TITLE="TvOS Native Launcher (Latest Build)"
          fi

          mkdir -p release_out
          APK_SOURCE=$(find apps/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No release APK found"
            exit 1
          fi

          APK_NAME="TvOS-Launcher-${TAG}.apk"
          cp "$APK_SOURCE" "release_out/${APK_NAME}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release_out/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "release_out/${APK_NAME}"

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: ${{ steps.meta.outputs.apk_path }}
          fail_on_unmatched_files: true
          make_latest: 'true'
          generate_release_notes: true
          body: "Direct APK download: tap ${{ steps.meta.outputs.apk_name }} under Assets below (no ZIP extraction needed)."
          
